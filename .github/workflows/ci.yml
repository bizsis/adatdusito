name: CODEX 02 validation
on:
  push:
    branches: [main, feat/codex-02-admin]
  pull_request:
permissions:
  contents: read
jobs:
  tests-and-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.lock
      - run: PYTHONPATH=backend python -m pytest -q backend/tests
      - run: npm ci && npm run build
        working-directory: frontend
      - run: docker build -t adatdusito-ci-backend backend
      - run: docker build -t adatdusito-ci-frontend frontend
