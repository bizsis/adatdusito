name: Adatdúsító CI
on:
  push:
    branches: [main, feat/codex-02-admin]
  pull_request:
permissions:
  contents: read
jobs:
  tests-and-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            scripts/browser-requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend and browser test dependencies
        run: python -m pip install -r backend/requirements.lock -r scripts/browser-requirements.txt
      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Build frontend for browser tests
        run: npm ci && npm run build
        working-directory: frontend
      - name: Run backend and browser tests
        run: PYTHONPATH=backend python -m pytest -q backend/tests
      - run: docker build -t adatdusito-ci-backend backend
      - run: docker build -t adatdusito-ci-frontend frontend
  menu-export-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.0.1 -r scripts/browser-requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q scripts/tests/test_emag_menu_export.py
