name: Adatdúsító CI

# Test partition (every test file runs in exactly one job):
#   backend    backend/tests + scripts/tests, except *_browser.py and the menu export test
#   browser    backend/tests/*_browser.py + scripts/tests/*_browser.py (Chromium)
#   menu-export scripts/tests/test_emag_menu_export.py with only the tool's own deps
#   mysql-migrations  Alembic 0009-0011 downgrade/upgrade regression on a throwaway
#                     MySQL 8 service container (RELEASE-03, owner: Claude)
# See docs/development/CI.md and docs/development/RELEASE-03-MYSQL-CI.md.

on:
  push:
    branches: [main, codex/category-03d-full-integration, codex/release-candidate-01, codex/help-01, codex/help-02-complete-manual, codex/release-candidate-02, codex/template-01, codex/knowledge-ui-01, codex/release-candidate-04]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR and these integration branches cancel old runs; main keeps every run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/codex/help-02-complete-manual' || github.ref == 'refs/heads/codex/release-candidate-02' || github.ref == 'refs/heads/codex/template-01' || github.ref == 'refs/heads/codex/knowledge-ui-01' || github.ref == 'refs/heads/codex/release-candidate-04')) }}

env:
  PYTHON_VERSION: "3.12" # matches backend/Dockerfile
  NODE_VERSION: "22" # matches frontend/Dockerfile
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      knowledge-ui-mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: knowledge-ci-only-throwaway
          MYSQL_DATABASE: adatdusito_dev
        ports: ["33308:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=3s --health-retries=30
      rc02-import-mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rc02-ci-only-throwaway
          MYSQL_DATABASE: adatdusito_dev
        ports: ["33307:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-test.lock
      - name: Install locked runtime + test dependencies exactly (no resolver) and verify consistency
        run: |
          python -m pip install --no-deps -r backend/requirements.lock -r backend/requirements-test.lock
          python -m pip check
      - name: Check dependency files (pins, runtime/test separation, resolver agreement)
        run: python backend/scripts/check_requirements.py --resolve
      - name: Run backend and tooling tests
        env:
          PYTHONPATH: backend
        run: >-
          python -m pytest -q -ra --durations=15
          backend/tests scripts/tests
          --ignore-glob='*_browser.py'
          --ignore=scripts/tests/test_emag_menu_export.py
          --junitxml=reports/backend.xml
      - name: RC-02 import API regression on isolated MySQL 8 (no reference database)
        env:
          APP_DATABASE_URL: mysql+pymysql://root:rc02-ci-only-throwaway@127.0.0.1:33307/adatdusito_dev
          RC02_FIXTURE_ACK: isolated-release-candidate-02
        run: |
          set -o pipefail
          python scripts/mysql_rc02_import_check.py 2>&1 | tee reports/mysql-rc02-import.log
      - name: Integrated knowledge UI and 0013-0016 migration regression on isolated MySQL 8
        env:
          APP_DATABASE_URL: mysql+pymysql://root:knowledge-ci-only-throwaway@127.0.0.1:33308/adatdusito_dev
          KNOWLEDGE_UI_FIXTURE_ACK: isolated-knowledge-ui-01
        run: |
          set -o pipefail
          python scripts/mysql_knowledge_ui_check.py 2>&1 | tee reports/mysql-knowledge-ui.log
      - name: Test summary
        if: always()
        run: python .github/scripts/ci_report.py junit reports/backend.xml --title "Backend tests" --summary
      - name: Keep test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: reports/
          retention-days: 7
          if-no-files-found: ignore

  browser:
    name: Browser tests (Playwright, Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-test.lock
            scripts/browser-requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend and browser test dependencies
        run: python -m pip install -r backend/requirements.lock -r backend/requirements-test.lock -r scripts/browser-requirements.txt
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/browser-requirements.txt') }}
      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Build frontend bundle served by the browser tests
        working-directory: frontend
        # Type checking runs in the frontend job; only the bundle is needed here.
        run: npm ci --no-audit --no-fund && npx vite build
      - name: Run browser tests
        env:
          PYTHONPATH: backend
        run: >-
          python -m pytest -q -ra --durations=10
          backend/tests/*_browser.py scripts/tests/*_browser.py
          --junitxml=reports/browser.xml
      - name: Test summary
        if: always()
        run: python .github/scripts/ci_report.py junit reports/browser.xml --title "Browser tests" --summary
      - name: Keep test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report
          path: |
            reports/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  menu-export:
    name: eMAG menu export tool (standalone)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements-test.lock
            scripts/browser-requirements.txt
      # Deliberately without backend runtime dependencies: the tool runs on
      # Windows machines with only Playwright installed. pytest comes from the
      # test lock (single pin, backend/requirements-test.in).
      - run: python -m pip install -r backend/requirements-test.lock -r scripts/browser-requirements.txt
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/browser-requirements.txt') }}
      - run: python -m playwright install --with-deps chromium
      - name: Run menu export tests
        run: python -m pytest -q -ra scripts/tests/test_emag_menu_export.py --junitxml=reports/menu-export.xml
      - name: Test summary
        if: always()
        run: python .github/scripts/ci_report.py junit reports/menu-export.xml --title "Menu export tool" --summary
      - name: Keep test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: menu-export-test-report
          path: reports/
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    name: Frontend lint, type check and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Blocking frontend lint and configuration tests
        run: npm run lint && npm test
      - name: TypeScript type check (tsc --noEmit, frontend/tsconfig.json)
        run: npx tsc --noEmit -p tsconfig.json --pretty false
      - name: Production build
        run: npx vite build

  docker:
    name: Docker images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: adatdusito-ci-backend
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Backend image contains runtime dependencies only
        run: |
          docker run --rm --entrypoint python adatdusito-ci-backend -c "
          import importlib.util, sys
          bad = [m for m in ('pytest', '_pytest', 'pluggy', 'iniconfig') if importlib.util.find_spec(m)]
          sys.exit(f'test packages in the runtime image: {bad}' if bad else 0)"
          docker run --rm --entrypoint sh adatdusito-ci-backend -c 'test ! -e /app/tests && test ! -e /app/requirements-test.lock && pip check'
          docker run --rm --entrypoint python adatdusito-ci-backend -c "import app.main"
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: adatdusito-ci-frontend
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  mysql-migrations:
    # RELEASE-03 (#38): the SQLite jobs above cannot see MySQL-only DDL failures
    # (RELEASE-02 B1: error 1553 in the 0009-0011 downgrades). Throwaway service
    # container, empty database, test-only credentials: never pinfo_db or the VPS.
    name: MySQL 8 migrations (downgrade regression)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-throwaway
          MYSQL_DATABASE: adatdusito_dev
        ports:
          - 33306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-throwaway --silent"
          --health-interval=5s --health-timeout=5s --health-retries=36
          --memory=1g
    env:
      # Test-only password of the throwaway container above; not a production secret.
      APP_DATABASE_URL: mysql+pymysql://root:ci-only-throwaway@127.0.0.1:33306/adatdusito_dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install locked runtime dependencies (alembic, SQLAlchemy, PyMySQL)
        run: python -m pip install --no-deps -r backend/requirements.lock
      - name: Prepare the database helper (empty adatdusito_dev on the service only)
        run: |
          mkdir -p reports
          cat > "$RUNNER_TEMP/mysql_ci_db.py" <<'PY'
          """wait: until the service answers; reset: drop and recreate the empty test database."""
          import os, sys, time
          from sqlalchemy import create_engine, make_url, text
          url = make_url(os.environ["APP_DATABASE_URL"])
          assert url.host == "127.0.0.1" and url.database == "adatdusito_dev", "only the CI service"
          server = create_engine(url.set(database=None))
          for attempt in range(60):
              try:
                  with server.connect() as c:
                      version = c.scalar(text("SELECT VERSION()"))
                      break
              except Exception:
                  time.sleep(2)
          else:
              sys.exit("MySQL service did not become ready")
          if sys.argv[1:] == ["reset"]:
              with server.begin() as c:
                  c.execute(text("DROP DATABASE IF EXISTS adatdusito_dev"))
                  c.execute(text("CREATE DATABASE adatdusito_dev CHARACTER SET utf8mb4"))
          print(f"MySQL {version} ready; database adatdusito_dev {'recreated empty' if sys.argv[1:] == ['reset'] else 'present'}")
          PY
          python "$RUNNER_TEMP/mysql_ci_db.py" wait
      - name: Downgrade/upgrade regression (0008-0011, 3 rounds, schema + data fingerprints, guards)
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          python ../scripts/mysql_release02_downgrade_check.py --rounds 3 2>&1 | tee ../reports/mysql-release02.log
      - name: Negative control - a reintroduced B1 downgrade must fail the check (exit 1, error 1553)
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python "$RUNNER_TEMP/mysql_ci_db.py" reset
          control="$RUNNER_TEMP/migrations-b1-control"
          rm -rf "$control" && cp -r migrations "$control"
          python - "$control/versions/0010_product_parameters.py" <<'PY'
          import sys
          path = sys.argv[1]
          source = open(path, encoding="utf-8").read()
          anchor = '    op.drop_table("product_parameter_values")\n'
          assert source.count(anchor) == 1, "control anchor not found"
          # Restore the exact pre-RELEASE-02 lines: once both tenant_id-leading indexes are
          # dropped one by one, MySQL refuses the second one (error 1553).
          broken = ('    op.drop_index("ix_product_parameter_emag", "product_parameter_values")\n'
                    '    op.drop_index("ix_product_parameter_state", "product_parameter_values")\n' + anchor)
          open(path, "w", encoding="utf-8").write(source.replace(anchor, broken))
          PY
          set +e
          python ../scripts/mysql_release02_downgrade_check.py --rounds 1 --migrations "$control" \
            > ../reports/mysql-b1-control.log 2>&1
          code=$?
          set -e
          grep -E '^(OK|ERR) |^\{' ../reports/mysql-b1-control.log | head -12
          echo "negative control exit code: $code"
          test "$code" -eq 1 || { echo "::error::the check did not fail on the broken downgrade (exit $code)"; exit 1; }
          grep -q "1553" ../reports/mysql-b1-control.log || { echo "::error::expected MySQL error 1553 not seen"; exit 1; }
          echo "negative control OK: the reintroduced B1 downgrade is detected"
      - name: RELEASE-01 check (only when scripts/mysql_release01_check.py is on this branch, PR #34)
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          if [ ! -f ../scripts/mysql_release01_check.py ]; then
            echo "::notice::scripts/mysql_release01_check.py is not on this branch (it comes with PR #34); it runs here automatically once both are integrated."
            exit 0
          fi
          python "$RUNNER_TEMP/mysql_ci_db.py" reset
          set -o pipefail
          python ../scripts/mysql_release01_check.py 2>&1 | tee ../reports/mysql-release01.log
      - name: KNOWLEDGE-02 check (0015 <-> 0016, copy suspicion, merges, guarded downgrade)
        working-directory: backend
        env:
          PYTHONPATH: .
          KNOWLEDGE02_FIXTURE_ACK: isolated-knowledge-02
        run: |
          python "$RUNNER_TEMP/mysql_ci_db.py" reset
          set -o pipefail
          python ../scripts/mysql_knowledge02_check.py 2>&1 | tee ../reports/mysql-knowledge02.log
      - name: MySQL job summary
        if: always()
        run: |
          {
            echo "### MySQL 8 migrations"
            for f in reports/mysql-release02.log reports/mysql-b1-control.log reports/mysql-release01.log reports/mysql-knowledge02.log; do
              [ -f "$f" ] || continue
              echo "**$f**: $(grep -c '^OK ' "$f" 2>/dev/null || true) OK, $(grep -c '^ERR ' "$f" 2>/dev/null || true) ERR"
              echo '```'
              grep -E '^\{' "$f" | tail -1 || true
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep MySQL logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-migration-logs
          path: reports/
          retention-days: 7
          if-no-files-found: ignore

  ci-ok:
    # Single required status; blocking lint runs inside the frontend job.
    name: CI result
    if: always()
    needs: [backend, browser, menu-export, frontend, docker, mysql-migrations]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: All required jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = {name: job["result"] for name, job in json.loads(os.environ["NEEDS"]).items()}
          print("required jobs:", results)
          bad = {name: result for name, result in results.items() if result != "success"}
          sys.exit(f"failed: {bad}" if bad else 0)
          PY
