server {
    listen 443 ssl;
    server_name dev.pinfo.hu;
    ssl_certificate /etc/letsencrypt/live/dev.pinfo.hu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.pinfo.hu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Must match frontend/nginx.conf (51m): 50 MB app file limit + multipart overhead.
    client_max_body_size 51m;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (do not append to) client-supplied values; the backend trusts
        # forwarded headers only from TRUSTED_PROXY_CIDRS peers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
