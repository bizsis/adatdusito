# Never log OAuth authorization codes/state or other query parameters.
log_format adatdusito_safe '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';
server {
    listen 8080;
    access_log /var/log/nginx/access.log adatdusito_safe;
    client_max_body_size 51m;
    server_name _;
    root /usr/share/nginx/html;
    location /api/ { proxy_pass http://backend:8000; proxy_connect_timeout 5s; proxy_read_timeout 30s; }
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ /index.html;
    }
}
